name: Build Harmony APK

on:
  workflow_dispatch:        # ручной запуск кнопкой Run workflow
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Системные зависимости buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Кэш SDK/NDK и колёс
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.pyside6_android_deploy
            build/wheels
          key: apk-${{ hashFiles('android/build_apk.sh') }}

      - name: Сборка APK (arm64)
        run: bash android/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Harmony-apk
          path: build/out/*.apk
          if-no-files-found: error
