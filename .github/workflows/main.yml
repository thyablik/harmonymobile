name: Build Harmony APK

on:
  workflow_dispatch:        # ручной запуск кнопкой Run workflow
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Системные зависимости buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Кэш SDK/NDK и колёс
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.pyside6_android_deploy
            build/wheels
          key: apk-v2-${{ hashFiles('android/build_apk.sh') }}

      - name: Сборка APK (arm64)
        run: bash android/build_apk.sh 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}

      - name: Поиск APK
        if: always()
        run: |
          echo "=== apk/aab ==="
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -not -path './build/venv/*' 2>/dev/null || true
          echo "=== build tree (2 уровня) ==="
          find build -maxdepth 2 -not -path 'build/venv*' -not -path 'build/wheels*' 2>/dev/null | head -60 || true
          mkdir -p collected
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -not -path './build/venv/*' -not -path './collected/*' \
            -exec cp {} collected/ \; 2>/dev/null || true
          ls -la collected

      - uses: actions/upload-artifact@v4
        with:
          name: Harmony-apk
          path: collected/*
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build-log.txt
            build/app/pysidedeploy.spec
            build/app/deployment/**
            build/out/**
            ~/.pyside6_android_deploy/**/*.log
          if-no-files-found: ignore
